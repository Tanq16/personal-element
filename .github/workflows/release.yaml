name: Release

on:
  push:
    branches: [main]
    paths:
      - 'element-agent/**'
      - '.github/workflows/release.yaml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: element-agent/go.sum

      - name: Run tests
        run: go test ./...
        working-directory: element-agent

  create-release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_created: ${{ steps.create_release.outputs.release_created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: echo "version=$(make -s version)" >> "$GITHUB_OUTPUT"
        working-directory: element-agent

      - name: Create draft release
        id: create_release
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "Release ${{ steps.version.outputs.version }}" \
            --draft \
            --notes "element-agent ${{ steps.version.outputs.version }}" \
            --target ${{ github.sha }}
          echo "release_created=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  binaries:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: element-agent/go.sum

      - name: Build binary
        run: make build-for GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} VERSION=${{ needs.create-release.outputs.version }}
        working-directory: element-agent

      - name: Upload release asset
        run: |
          BINARY=$(ls *-${{ matrix.os }}-${{ matrix.arch }} 2>/dev/null | head -1)
          gh release upload "${{ needs.create-release.outputs.version }}" "$BINARY" --clobber
        working-directory: element-agent
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [create-release, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish release
        run: gh release edit "${{ needs.create-release.outputs.version }}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

  cleanup-on-failure:
    needs: [create-release, binaries, publish]
    if: always() && (needs.binaries.result == 'failure' || needs.publish.result == 'failure') && needs.create-release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Delete draft release
        run: gh release delete "${{ needs.create-release.outputs.version }}" --yes
        env:
          GH_TOKEN: ${{ github.token }}
